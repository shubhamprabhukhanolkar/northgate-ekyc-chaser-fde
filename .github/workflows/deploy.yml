name: Test and Deploy Northgate eKYC
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT }}
  REGION: asia-south1
  GAR_REPOSITORY: omnistream-repo
  SERVICE_NAME: northgate-ekyc-chaser
  SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
concurrency:
  group: northgate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Same auth -> Docker build/push -> deploy-cloudrun pattern as p1.yml.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS || secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Ensure regional image repository
        run: |
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location="$REGION" --project="$PROJECT_ID" --quiet ||
          gcloud artifacts repositories create "$GAR_REPOSITORY" --repository-format=docker --location="$REGION" --project="$PROJECT_ID" --quiet
      - name: Build and push unified container
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME"
          docker build --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Configure Secret Manager runtime secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          DEFAULT_OPERATOR_PASSWORD: ${{ secrets.DEFAULT_OPERATOR_PASSWORD }}
        run: python scripts/sync_runtime_secrets.py
      - name: Prepare runtime environment
        env:
          GEMINI_MODEL_NAME: ${{ vars.GEMINI_MODEL_NAME }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: |
          python - <<'PY'
          import os, json
          values = {"APP_ENV":"local", "DATABASE_PATH":"/app/data/northgate.db",
              "STATIC_DIR":"/app/static", "SECURE_COOKIES":"true", "OFFLINE_DEMO":"false",
              "GEMINI_MODEL_NAME":os.environ["GEMINI_MODEL_NAME"], "GROQ_MODEL":os.environ.get("GROQ_MODEL") or "llama-3.3-70b-versatile"}
          with open('.runtime-env.yml','w') as f: json.dump(values,f)
          PY
      - name: Deploy single instance to Mumbai
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE_NAME }}
          region: asia-south1
          image: asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/omnistream-repo/northgate-ekyc-chaser:${{ github.sha }}
          env_vars_file: .runtime-env.yml
          env_vars_update_strategy: merge
          secrets: |
            GEMINI_API_KEY=northgate-gemini-api-key:latest
            GROQ_API_KEY=northgate-groq-api-key:latest
            AUTH_SECRET=northgate-auth-secret:latest
            MCP_API_KEY=northgate-mcp-api-key:latest
            DEFAULT_OPERATOR_PASSWORD=northgate-default-operator-password:latest
          flags: >-
            --service-account=${{ env.SERVICE_ACCOUNT }}
            --allow-unauthenticated --ingress=all --port=8080
            --min-instances=1 --max-instances=1 --concurrency=8
            --memory=2Gi --cpu=2 --no-cpu-throttling --timeout=600s
      - name: Verify hosted app and authenticated MCP
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request, json
          url=os.environ['SERVICE_URL']
          for path in ['/api/health','/']:
              with urllib.request.urlopen(url+path, timeout=60) as r: assert r.status==200
          payload={"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deployment-check","version":"1"}}}
          req=urllib.request.Request(url+'/mcp/', data=json.dumps(payload).encode(), headers={'Authorization':'Bearer '+os.environ['MCP_API_KEY'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=60) as r: assert json.load(r)['result']['serverInfo']['name']=='Northgate eKYC'
          print('Verified Northgate app and MCP at '+url)
          PY
